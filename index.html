t){fb.className=cls;fb.textContent=text;fb.style.display='block'}function themeMeta(k){return SK_THEMES.find(t=>t[0]===k)||['all','Все вопросы','']}function home(){title.textContent='Проверка компетенций';cnt.textContent='Выберите режим';bar.style.width='0';q.textContent='';opts.innerHTML='<p class="sk-lead">Можно пройти проверку из 45 случайных вопросов или учиться по отдельным темам.</p><div class="sk-mode-grid"><button class="sk-mode" id="sk-start-check" type="button"><b>Начать проверку</b><span>45 случайных вопросов. Успех от 23 правильных.</span></button><button class="sk-mode" id="sk-start-study" type="button"><b>Режим обучения</b><span>Все вопросы или отдельные тематические блоки.</span></button></div>';fb.className='';fb.style.display='none';next.style.display='none';document.getElementById('sk-start-check').onclick=()=>start('check','all');document.getElementById('sk-start-study').onclick=topics}function topics(){title.textContent='Режим обучения';cnt.textContent='Выберите тему';bar.style.width='0';q.textContent='';const counts=Object.fromEntries(SK_THEMES.map(t=>[t[0],SK_DATA.filter(x=>x[3]===t[0]).length]));let html='<p class="sk-lead">Выберите блок, если хотите потренировать конкретную зону. Внутри каждого блока вопросы идут случайно.</p><div class="sk-topic-grid"><button class="sk-mode" data-topic="all"><b>Все вопросы</b><span>Полный режим обучения</span><i class="sk-tag">'+SK_DATA.length+' вопросов</i></button>';SK_THEMES.forEach(t=>html+='<button class="sk-mode" data-topic="'+t[0]+'"><b>'+t[1]+'</b><span>'+t[2]+'</span><i class="sk-tag">'+counts[t[0]]+' вопросов</i></button>');opts.innerHTML=html+'</div>';fb.className='';fb.style.display='none';next.style.display='none';opts.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('study',b.dataset.topic))}function start(m,t){mode=m;topic=t;misses=[];pool=SK_DATA.map((_,i)=>i).filter(i=>t==='all'||SK_DATA[i][3]===t);order=shuffle([...pool]);if(mode==='check')order=order.slice(0,CHECK_SIZE);pos=0;score=0;next.style.display='inline-block';show()}function show(){locked=false;next.disabled=true;fb.className='';fb.style.display='none';const item=SK_DATA[order[pos]],choices=shuffle(item[1].map((t,i)=>({t,i})));title.textContent=mode==='check'?'Проверка компетенций':'Обучение: '+(topic==='all'?'все темы':themeMeta(topic)[1]);cnt.textContent=`Вопрос ${pos+1} из ${order.length} · верно: ${score}`;bar.style.width=(pos/order.length*100)+'%';q.textContent=item[0];opts.innerHTML='';choices.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='sk-opt';b.textContent=c.t;b.onclick=()=>answer(b,c.i,item);opts.appendChild(b)});next.textContent=pos===order.length-1?'Показать итог':'Следующий вопрос'}function answer(btn,i,item){if(locked)return;locked=true;const buttons=[...opts.children],ok=item[2];buttons.forEach(b=>b.disabled=true);buttons.find(b=>b.textContent===item[1][ok])?.classList.add('ok');if(i===ok){score++;btn.classList.add('ok');setFeedback('ok','Верно! Отлично, вы выбрали правильный ответ.')}else{btn.classList.add('bad');misses.push([item[0],item[1][ok]]);setFeedback('bad','Неверно. Правильный ответ: '+item[1][ok])}cnt.textContent=`Вопрос ${pos+1} из ${order.length} · верно: ${score}`;next.disabled=false}function reviewHtml(){if(!misses.length)return '<div class="sk-review"><h4>Где вы ошиблись</h4><p class="sk-lead">Ошибок нет. Отличный результат.</p></div>';return '<div class="sk-review"><h4>Где вы ошиблись</h4>'+misses.map((m,i)=>'<div class="sk-miss"><p>'+(i+1)+'. '+esc(m[0])+'</p><p>Верный ответ: <strong>'+esc(m[1])+'</strong></p></div>').join('')+'</div>'}function finish(){bar.style.width='100%';q.textContent=mode==='check'?(score>=PASS?'Проверка успешно пройдена':'Проверка пока не пройдена'):'Обучение завершено';const msg=mode==='check'?`Ваш результат: ${score} из ${order.length}. Для успешного прохождения нужно ${PASS} и более.`:`Вы прошли ${order.length} вопросов. Верных ответов: ${score}.`;setFeedback(mode==='check'&&score>=PASS?'ok':mode==='check'?'bad':'neutral',msg);next.style.display='none';opts.innerHTML=reviewHtml()+'<div class="sk-actions"><button class="sk-btn" id="sk-again" type="button">'+(mode==='check'?'Пройти проверку еще раз':'Пройти этот блок еще раз')+'</button><button class="sk-btn secondary" id="sk-study" type="button">'+(mode==='check'?'Продолжить обучение':'Выбрать другой блок')+'</button></div>';document.getElementById('sk-again').onclick=()=>start(mode,topic);document.getElementById('sk-study').onclick=topics}next.onclick=()=>{if(pos<order.length-1){pos++;show()}else finish()};restart.onclick=home;home()})();</script>
